<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Dev Hub · Biblioteca</title>

    <!-- Google Fonts: Inter (para legibilidade) + Georgia (serifada) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome 6 (Free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        /* ============================================================
           RESET & BASE — atmosfera de biblioteca escura
           ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* --- Paleta escura "madeira e pergaminho" --- */
            --bg-primary: #1a1410;
            --bg-secondary: #241e18;
            --bg-tertiary: #2f2620;
            --bg-elevated: #3b3028;
            --bg-sidebar: #15100d;
            --bg-card: #2a221c;
            --bg-glass: rgba(255, 255, 255, 0.03);

            --text-primary: #f5e6d3;
            --text-secondary: #c4b5a6;
            --text-muted: #8a7a6a;
            --text-inverse: #1a1410;

            --border-subtle: #3d322a;
            --border-medium: #5a4a3a;
            --border-glow: rgba(212, 163, 115, 0.3);

            --accent-cyan: #d4a373;      /* dourado envelhecido */
            --accent-cyan-dim: rgba(212, 163, 115, 0.12);
            --accent-cyan-glow: rgba(212, 163, 115, 0.20);
            --accent-gold: #e9c46a;
            --accent-gold-dim: rgba(233, 196, 106, 0.10);
            --accent-gold-glow: rgba(233, 196, 106, 0.15);
            --accent-red: #c05a4a;
            --accent-green: #7a9a6a;
            --accent-orange: #c08040;

            --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.6);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.7);
            --shadow-lg: 0 16px 64px rgba(0, 0, 0, 0.8);
            --shadow-glow: 0 0 40px rgba(212, 163, 115, 0.05);

            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --radius-xl: 22px;

            --font: 'Inter', 'Segoe UI', sans-serif;
            --font-heading: 'Georgia', 'Times New Roman', serif;
            --sidebar-width: 270px;
            --header-height: 60px;
            --transition-speed: 0.25s;
            --transition-bounce: cubic-bezier(0.34, 1.2, 0.64, 1);

            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.04);
            --glass-blur: 8px;
        }

        /* --- Aplicação global --- */
        html,
        body {
            height: 100%;
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-medium);
            border-radius: 10px;
            border: 1px solid var(--bg-elevated);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-cyan);
        }

        /* ============================================================
           LAYOUT GERAL
           ============================================================ */
        #app {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: var(--bg-primary);
            position: relative;
        }

        /* ============================================================
           SIDEBAR — estante de livros / catálogo
           ============================================================ */
        #sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: var(--sidebar-width);
            background: var(--bg-sidebar);
            border-right: 2px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            transition: transform var(--transition-speed) var(--transition-bounce);
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.7);
        }

        #sidebar.collapsed {
            transform: translateX(-100%);
        }

        #sidebar.open {
            transform: translateX(0);
        }

        /* Logo */
        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 20px 14px 20px;
            border-bottom: 2px solid var(--border-subtle);
            flex-shrink: 0;
            background: var(--bg-glass);
            backdrop-filter: blur(4px);
        }
        .sidebar-logo .logo-icon {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-sm);
            background: linear-gradient(145deg, var(--accent-cyan), #8a6a4a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: var(--text-inverse);
            flex-shrink: 0;
            box-shadow: inset -2px -2px 6px rgba(0,0,0,0.5), inset 2px 2px 6px rgba(255,255,255,0.1);
            border: 1px solid var(--border-subtle);
        }
        .sidebar-logo .logo-text {
            font-size: 20px;
            font-weight: 700;
            font-family: var(--font-heading);
            letter-spacing: -0.2px;
            color: var(--text-primary);
            text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
        }
        .sidebar-logo .logo-badge {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--bg-primary);
            background: var(--accent-cyan);
            padding: 3px 12px;
            border-radius: 30px;
            border: 1px solid var(--border-medium);
            box-shadow: inset -1px -1px 4px rgba(0,0,0,0.3);
            margin-left: auto;
        }

        /* Navegação */
        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 12px 12px 24px 12px;
        }

        .sidebar-group {
            margin-bottom: 18px;
        }
        .sidebar-group:last-child {
            margin-bottom: 0;
        }

        .sidebar-group-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            padding: 6px 12px 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 4px;
            font-family: var(--font-heading);
        }
        .sidebar-group-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-subtle);
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background var(--transition-speed) ease,
                color var(--transition-speed) ease,
                transform 0.15s ease;
            color: var(--text-secondary);
            text-decoration: none;
            position: relative;
            font-size: 13px;
            font-weight: 450;
            user-select: none;
            border-left: 2px solid transparent;
            margin-bottom: 1px;
        }
        .sidebar-item:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            transform: translateX(4px);
            border-left-color: var(--accent-cyan);
        }
        .sidebar-item:active {
            transform: scale(0.97);
        }
        .sidebar-item .icon {
            width: 20px;
            text-align: center;
            font-size: 14px;
            flex-shrink: 0;
            color: var(--text-muted);
            transition: color var(--transition-speed) ease;
        }
        .sidebar-item:hover .icon {
            color: var(--accent-cyan);
        }
        .sidebar-item .label {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar-item .badge {
            font-size: 9px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 30px;
            background: var(--accent-cyan-dim);
            color: var(--accent-cyan);
            border: 1px solid var(--border-subtle);
            flex-shrink: 0;
        }

        .sidebar-item.active {
            background: var(--accent-cyan-dim);
            color: var(--text-primary);
            border-left-color: var(--accent-cyan);
            box-shadow: inset 0 0 20px var(--accent-cyan-glow);
        }
        .sidebar-item.active .icon {
            color: var(--accent-cyan);
            text-shadow: 0 0 12px var(--accent-cyan-glow);
        }
        .sidebar-item.active .badge {
            background: var(--accent-cyan);
            color: var(--bg-primary);
            border-color: var(--accent-cyan);
        }

        /* ============================================================
           HEADER — balcão de atendimento / arquivo
           ============================================================ */
        #header {
            height: var(--header-height);
            min-height: var(--header-height);
            background: var(--bg-secondary);
            border-bottom: 2px solid var(--border-subtle);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 14px;
            flex-shrink: 0;
            transition: background var(--transition-speed) ease,
                border-color var(--transition-speed) ease;
            position: relative;
            z-index: 100;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.5);
        }

        #hamburger {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: var(--radius-sm);
            transition: all var(--transition-speed) ease;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset -1px -1px 4px rgba(0,0,0,0.4), inset 1px 1px 4px rgba(255,255,255,0.05);
        }
        #hamburger:hover {
            background: var(--bg-elevated);
            color: var(--text-primary);
            border-color: var(--border-medium);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            flex: 1;
        }
        .header-title {
            font-size: 18px;
            font-weight: 700;
            font-family: var(--font-heading);
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -0.2px;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.4);
        }
        .header-breadcrumb {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .header-breadcrumb .sep {
            color: var(--border-medium);
            font-weight: 700;
        }
        .header-breadcrumb .crumb {
            color: var(--text-secondary);
            transition: color var(--transition-speed) ease;
        }
        .header-breadcrumb .crumb:last-child {
            color: var(--text-primary);
            font-weight: 600;
        }
        .header-breadcrumb .crumb-link {
            color: var(--text-muted);
            cursor: pointer;
            transition: color var(--transition-speed) ease;
            text-decoration: none;
            border-bottom: 1px dotted transparent;
        }
        .header-breadcrumb .crumb-link:hover {
            color: var(--accent-cyan);
            border-bottom-color: var(--accent-cyan);
        }

        .header-search {
            display: flex;
            align-items: center;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
            border-radius: 30px;
            padding: 0 14px;
            gap: 8px;
            transition: border-color var(--transition-speed) ease,
                background var(--transition-speed) ease,
                box-shadow 0.2s ease;
            flex-shrink: 0;
            min-width: 180px;
            max-width: 260px;
            box-shadow: inset 1px 1px 6px rgba(0,0,0,0.4), inset -1px -1px 4px rgba(255,255,255,0.02);
        }
        .header-search:focus-within {
            border-color: var(--accent-cyan);
            background: var(--bg-elevated);
            box-shadow: 0 0 20px var(--accent-cyan-glow);
        }
        .header-search .search-icon {
            color: var(--text-muted);
            font-size: 13px;
        }
        .header-search input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: var(--font);
            font-size: 13px;
            padding: 7px 0;
            width: 100%;
        }
        .header-search input::placeholder {
            color: var(--text-muted);
            font-style: italic;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .header-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            font-size: 14px;
            padding: 5px 9px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition-speed) ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: inset -1px -1px 4px rgba(0,0,0,0.4), inset 1px 1px 4px rgba(255,255,255,0.03);
        }
        .header-btn:hover {
            background: var(--bg-elevated);
            color: var(--text-primary);
            border-color: var(--border-medium);
        }
        .header-btn:active {
            transform: scale(0.95);
            box-shadow: inset 2px 2px 6px rgba(0,0,0,0.5);
        }
        .header-btn .tooltip {
            display: none;
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-elevated);
            color: var(--text-primary);
            padding: 4px 14px;
            border-radius: var(--radius-sm);
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-sm);
            pointer-events: none;
            font-family: var(--font);
        }
        .header-btn:hover .tooltip {
            display: block;
        }

        .save-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: var(--text-muted);
            padding: 4px 14px 4px 10px;
            border: 1px solid var(--border-subtle);
            border-radius: 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(4px);
            box-shadow: inset -1px -1px 4px rgba(0,0,0,0.3), inset 1px 1px 4px rgba(255,255,255,0.02);
        }
        .save-indicator .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-green);
            transition: background 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 0 12px var(--accent-green);
            border: 1px solid rgba(0,0,0,0.2);
        }
        .save-indicator .dot.saving {
            background: var(--accent-orange);
            box-shadow: 0 0 16px var(--accent-orange);
            animation: pulse-dot 0.8s ease-in-out infinite alternate;
        }
        .save-indicator .dot.error {
            background: var(--accent-red);
            box-shadow: 0 0 16px var(--accent-red);
        }

        @keyframes pulse-dot {
            0% { opacity: 0.5; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* ============================================================
           ÁREA PRINCIPAL — luz de abajur sobre o pergaminho
           ============================================================ */
        #main {
            flex: 1;
            margin-left: var(--sidebar-width);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            transition: margin-left var(--transition-speed) var(--transition-bounce);
            background: var(--bg-primary);
            position: relative;
        }
        #main::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at 30% 20%, rgba(212, 163, 115, 0.06) 0%, transparent 60%),
                radial-gradient(circle at 70% 80%, rgba(212, 163, 115, 0.03) 0%, transparent 50%);
            z-index: 0;
        }
        #main.expanded {
            margin-left: 0;
        }

        #content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 28px 36px 40px 36px;
            background: transparent;
            position: relative;
            z-index: 1;
            transition: padding var(--transition-speed) ease;
        }

        /* Animações de entrada */
        .page-enter {
            animation: pageFadeIn 0.35s var(--transition-bounce) forwards;
        }

        @keyframes pageFadeIn {
            0% { opacity: 0; transform: translateY(12px); filter: blur(1px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        /* Placeholder — ficha de catálogo */
        .page-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 55vh;
            text-align: center;
            gap: 18px;
            color: var(--text-secondary);
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 2px solid var(--border-subtle);
            padding: 48px 32px;
            box-shadow: var(--shadow-md);
            backdrop-filter: blur(4px);
            background: var(--glass-bg);
        }
        .page-placeholder .icon-big {
            font-size: 64px;
            color: var(--text-muted);
            opacity: 0.15;
        }
        .page-placeholder h2 {
            font-size: 24px;
            font-weight: 700;
            font-family: var(--font-heading);
            color: var(--text-primary);
            text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
        }
        .page-placeholder p {
            font-size: 14px;
            color: var(--text-muted);
            max-width: 460px;
            line-height: 1.6;
        }
        .page-placeholder .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-subtle);
            border-top-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            box-shadow: 0 0 24px var(--accent-cyan-glow);
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============================================================
           TOASTS — estilo bilhetes de arquivo
           ============================================================ */
        #toast-container {
            position: fixed;
            bottom: 28px;
            right: 28px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 9999;
            max-width: 400px;
            width: 100%;
            pointer-events: none;
        }

        .toast {
            pointer-events: auto;
            background: var(--bg-elevated);
            border: 2px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 14px 18px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            box-shadow: var(--shadow-md);
            animation: toastSlide 0.35s var(--transition-bounce) forwards;
            transition: opacity 0.3s ease, transform 0.3s ease;
            border-left: 6px solid var(--text-muted);
        }
        .toast.removing {
            opacity: 0;
            transform: translateX(40px) scale(0.95);
        }

        .toast .toast-icon {
            font-size: 18px;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .toast .toast-content {
            flex: 1;
            min-width: 0;
        }
        .toast .toast-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .toast .toast-message {
            font-size: 12.5px;
            color: var(--text-secondary);
            margin-top: 3px;
            line-height: 1.5;
        }
        .toast .toast-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            padding: 0 0 0 10px;
            transition: color var(--transition-speed) ease, transform 0.2s;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .toast .toast-close:hover {
            color: var(--text-primary);
            transform: scale(1.1);
        }

        .toast.success { border-left-color: var(--accent-green); }
        .toast.success .toast-icon { color: var(--accent-green); }
        .toast.error { border-left-color: var(--accent-red); }
        .toast.error .toast-icon { color: var(--accent-red); }
        .toast.warning { border-left-color: var(--accent-orange); }
        .toast.warning .toast-icon { color: var(--accent-orange); }
        .toast.info { border-left-color: var(--accent-cyan); }
        .toast.info .toast-icon { color: var(--accent-cyan); }

        @keyframes toastSlide {
            0% { opacity: 0; transform: translateX(40px) scale(0.95); }
            100% { opacity: 1; transform: translateX(0) scale(1); }
        }

        /* ============================================================
           CONFIRMAÇÃO — estilo caixa de arquivo morto
           ============================================================ */
        #confirmation-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }
        #confirmation-overlay.open {
            display: flex;
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .confirmation-box {
            background: var(--bg-elevated);
            border: 2px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 32px 36px;
            max-width: 480px;
            width: 90%;
            box-shadow: var(--shadow-lg);
            animation: modalPop 0.3s var(--transition-bounce) forwards;
            background: var(--bg-card);
        }

        @keyframes modalPop {
            0% { opacity: 0; transform: scale(0.95) translateY(12px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .confirmation-box .conf-icon {
            font-size: 32px;
            margin-bottom: 12px;
            display: block;
        }
        .confirmation-box h3 {
            font-size: 18px;
            font-weight: 700;
            font-family: var(--font-heading);
            color: var(--text-primary);
            margin-bottom: 6px;
        }
        .confirmation-box p {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .confirmation-box .conf-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .conf-btn {
            padding: 8px 22px;
            border-radius: 30px;
            border: 1px solid var(--border-subtle);
            font-family: var(--font);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-speed) ease;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            box-shadow: inset -1px -1px 4px rgba(0,0,0,0.4), inset 1px 1px 4px rgba(255,255,255,0.02);
        }
        .conf-btn:hover {
            background: var(--bg-elevated);
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
            transform: translateY(-1px);
        }
        .conf-btn:active {
            transform: scale(0.96);
            box-shadow: inset 2px 2px 6px rgba(0,0,0,0.5);
        }
        .conf-btn.primary {
            background: var(--accent-cyan);
            color: var(--text-inverse);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px var(--accent-cyan-glow);
        }
        .conf-btn.primary:hover {
            filter: brightness(1.05);
            box-shadow: 0 0 32px var(--accent-cyan-glow);
        }
        .conf-btn.danger {
            background: var(--accent-red);
            color: #fff;
            border-color: var(--accent-red);
            box-shadow: 0 0 20px rgba(192, 90, 74, 0.3);
        }
        .conf-btn.danger:hover {
            filter: brightness(1.05);
            box-shadow: 0 0 32px rgba(192, 90, 74, 0.4);
        }
        .conf-btn.gold {
            background: var(--accent-gold);
            color: var(--bg-primary);
            border-color: var(--accent-gold);
            box-shadow: 0 0 20px var(--accent-gold-glow);
        }
        .conf-btn.gold:hover {
            filter: brightness(1.05);
            box-shadow: 0 0 32px var(--accent-gold-glow);
        }

        /* ============================================================
           RESPONSIVIDADE
           ============================================================ */
        @media (max-width: 1024px) {
            #content { padding: 22px 24px 32px 24px; }
            .header-search { min-width: 140px; max-width: 200px; }
        }

        @media (max-width: 768px) {
            :root {
                --sidebar-width: 280px;
                --header-height: 56px;
            }
            #sidebar {
                transform: translateX(-100%);
                box-shadow: var(--shadow-lg);
                border-right: none;
            }
            #sidebar.open { transform: translateX(0); }
            #sidebar.collapsed { transform: translateX(-100%); }
            #main { margin-left: 0; }
            #main.expanded { margin-left: 0; }
            #content { padding: 16px 16px 24px 16px; }
            .header-left .header-breadcrumb { display: none; }
            .header-title { font-size: 15px; }
            .header-search { min-width: 90px; max-width: 140px; padding: 0 10px; }
            .header-search input { font-size: 12px; padding: 5px 0; }
            .header-actions .header-btn .tooltip { display: none !important; }
            .header-actions .header-btn { padding: 4px 6px; font-size: 13px; }
            .save-indicator span { display: none; }
            .save-indicator { padding: 3px 8px 3px 6px; }
            .confirmation-box { padding: 24px 20px; margin: 16px; }
            .confirmation-box .conf-actions { flex-wrap: wrap; }
            .confirmation-box .conf-actions .conf-btn { flex: 1; min-width: 70px; text-align: center; }
            #toast-container { bottom: 16px; right: 16px; left: 16px; max-width: 100%; }
            .toast { padding: 12px 14px; }
        }

        @media (max-width: 480px) {
            #content { padding: 10px 10px 16px 10px; }
            .header-actions .header-btn { padding: 3px 5px; font-size: 12px; }
            .header-search { min-width: 60px; max-width: 100px; padding: 0 6px; }
            .header-search input { font-size: 11px; }
            .sidebar-logo .logo-text { font-size: 16px; }
            .sidebar-logo .logo-badge { font-size: 7px; padding: 2px 8px; }
        }

        /* ============================================================
           OVERLAY PARA SIDEBAR EM MOBILE
           ============================================================ */
        #sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 999;
            backdrop-filter: blur(4px);
            transition: opacity 0.3s ease;
        }
        #sidebar-overlay.open { display: block; }

        @media (min-width: 769px) {
            #sidebar-overlay { display: none !important; }
        }

        .hidden { display: none !important; }
        .flex-center { display: flex; align-items: center; justify-content: center; }
        .gap-8 { gap: 8px; }
        .gap-12 { gap: 12px; }
        .text-glow { text-shadow: 0 0 24px var(--accent-cyan-glow); }
    </style>
</head>
<body>

    <!-- ============================================================
    APP
    ============================================================ -->
    <div id="app">

        <!-- SIDEBAR OVERLAY (mobile) -->
        <div id="sidebar-overlay"></div>

        <!-- ============================================================
        SIDEBAR — Catálogo
        ============================================================ -->
        <nav id="sidebar" role="navigation" aria-label="Catálogo do jogo">
            <div class="sidebar-logo">
                <div class="logo-icon" aria-hidden="true"><i class="fas fa-book-open"></i></div>
                <span class="logo-text">Game Hub</span>
                <span class="logo-badge">CATÁLOGO</span>
            </div>
            <div class="sidebar-nav" id="sidebarNav"></div>
        </nav>

        <!-- ============================================================
        MAIN
        ============================================================ -->
        <div id="main">
            <!-- HEADER -->
            <header id="header">
                <button id="hamburger" aria-label="Alternar barra lateral" title="Alternar barra lateral">
                    <i class="fas fa-bars"></i>
                </button>

                <div class="header-left">
                    <span class="header-title" id="pageTitle">Overview</span>
                    <div class="header-breadcrumb" id="breadcrumb">
                        <span class="crumb">Hub</span>
                        <span class="sep">/</span>
                        <span class="crumb crumb-link" data-page="overview">Overview</span>
                    </div>
                </div>

                <div class="header-search" role="search">
                    <i class="fas fa-search search-icon" aria-hidden="true"></i>
                    <input type="text" id="globalSearch" placeholder="Pesquisar no catálogo..." aria-label="Pesquisa global">
                </div>

                <div class="header-actions">
                    <button class="header-btn" id="btnExport" title="Exportar projeto">
                        <i class="fas fa-file-export"></i>
                        <span class="tooltip">Exportar</span>
                    </button>
                    <button class="header-btn" id="btnImport" title="Importar projeto">
                        <i class="fas fa-file-import"></i>
                        <span class="tooltip">Importar</span>
                    </button>
                    <button class="header-btn" id="btnBackup" title="Criar backup">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <span class="tooltip">Backup</span>
                    </button>
                    <button class="header-btn" id="btnRestore" title="Restaurar backup">
                        <i class="fas fa-cloud-download-alt"></i>
                        <span class="tooltip">Restaurar</span>
                    </button>
                    <button class="header-btn" id="btnSettings" title="Configurações">
                        <i class="fas fa-sliders-h"></i>
                        <span class="tooltip">Configurações</span>
                    </button>
                    <button class="header-btn" id="btnReset" title="Resetar projeto">
                        <i class="fas fa-trash-alt"></i>
                        <span class="tooltip">Resetar</span>
                    </button>

                    <div class="save-indicator" id="saveIndicator" title="Status do salvamento">
                        <span class="dot" id="saveDot"></span>
                        <span id="saveText">Salvo</span>
                    </div>
                </div>
            </header>

            <!-- CONTEÚDO PRINCIPAL -->
            <main id="content" role="main">
                <div id="pageContainer" class="page-enter">
                    <div class="page-placeholder">
                        <div class="spinner"></div>
                        <h2>Carregando acervo...</h2>
                        <p>Aguardando a abertura do catálogo.</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- ============================================================
    TOAST CONTAINER
    ============================================================ -->
    <div id="toast-container" aria-live="polite"></div>

    <!-- ============================================================
    CONFIRMATION OVERLAY
    ============================================================ -->
    <div id="confirmation-overlay" role="dialog" aria-modal="true" aria-labelledby="confTitle">
        <div class="confirmation-box">
            <span class="conf-icon" id="confIcon">⚠️</span>
            <h3 id="confTitle">Confirmar</h3>
            <p id="confMessage">Tem certeza que deseja continuar?</p>
            <div class="conf-actions">
                <button class="conf-btn" id="confCancel">Cancelar</button>
                <button class="conf-btn primary" id="confConfirm">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- ============================================================
    INPUT OCULTO PARA IMPORTAR ARQUIVO
    ============================================================ -->
    <input type="file" id="fileInput" accept=".json" style="display:none">

    <!-- ============================================================
    JAVASCRIPT — com ícones temáticos de biblioteca
    ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            // CONFIGURAÇÃO — ícones atualizados para o tema "Biblioteca"
            // ============================================================
            const CONFIG = {
                version: '2.0.0',
                storageKey: 'gamehub_project',
                backupKey: 'gamehub_backups',
                settingsKey: 'gamehub_settings',
                maxBackups: 10,
                autoSaveDelay: 800,
                pagesBase: 'pages/',
                defaultPage: 'overview',
                // Apenas o tema escuro, com cara de biblioteca
                themes: ['dark'],
                defaultTheme: 'dark',
                sidebarItems: [{
                    group: 'Catálogo Geral',
                    items: [
                        { id: 'overview', label: 'Overview', icon: 'fa-archive' },
                        { id: 'historia', label: 'História', icon: 'fa-scroll' },
                        { id: 'personagens', label: 'Personagens', icon: 'fa-id-card' },
                        { id: 'cidade', label: 'Cidade', icon: 'fa-city' },
                        { id: 'lugares', label: 'Lugares', icon: 'fa-map-pin' },
                        { id: 'timeline', label: 'Linha do Tempo', icon: 'fa-calendar' },
                        { id: 'anomalia', label: 'Anomalia', icon: 'fa-meteor' }
                    ]
                }, {
                    group: 'Desenvolvimento',
                    items: [
                        { id: 'capitulos', label: 'Capítulos', icon: 'fa-book' },
                        { id: 'mecanicas', label: 'Mecânicas', icon: 'fa-gears' },
                        { id: 'minijogos', label: 'Minijogos', icon: 'fa-dice-d6' },
                        { id: 'objetos', label: 'Objetos', icon: 'fa-cube' },
                        { id: 'artes', label: 'Artes', icon: 'fa-paintbrush' },
                        { id: 'interface', label: 'Interface', icon: 'fa-window-maximize' },
                        { id: 'programacao', label: 'Programação', icon: 'fa-code' }
                    ]
                }, {
                    group: 'Gestão',
                    items: [
                        { id: 'tarefas', label: 'Tarefas', icon: 'fa-tasks' },
                        { id: 'inspiracoes', label: 'Inspirações', icon: 'fa-lightbulb' },
                        { id: 'mural', label: 'Mural', icon: 'fa-sticky-note' },
                        { id: 'referencias', label: 'Referências', icon: 'fa-bookmark' }
                    ]
                }]
            };

            // ============================================================
            // ESTADO
            // ============================================================
            const state = {
                currentPage: CONFIG.defaultPage,
                projectData: null,
                settings: { theme: CONFIG.defaultTheme },
                isSaving: false,
                saveTimeout: null,
                sidebarOpen: true,
                isMobile: window.innerWidth <= 768,
                pageCache: {}
            };

            // ============================================================
            // DOM REFS
            // ============================================================
            const $ = (sel, ctx) => (ctx || document).querySelector(sel);
            const $$ = (sel, ctx) => [...(ctx || document).querySelectorAll(sel)];

            const dom = {
                sidebar: $('#sidebar'),
                sidebarNav: $('#sidebarNav'),
                sidebarOverlay: $('#sidebar-overlay'),
                hamburger: $('#hamburger'),
                main: $('#main'),
                content: $('#content'),
                pageContainer: $('#pageContainer'),
                pageTitle: $('#pageTitle'),
                breadcrumb: $('#breadcrumb'),
                globalSearch: $('#globalSearch'),
                saveIndicator: $('#saveIndicator'),
                saveDot: $('#saveDot'),
                saveText: $('#saveText'),
                toastContainer: $('#toast-container'),
                confOverlay: $('#confirmation-overlay'),
                confIcon: $('#confIcon'),
                confTitle: $('#confTitle'),
                confMessage: $('#confMessage'),
                confConfirm: $('#confConfirm'),
                confCancel: $('#confCancel'),
                fileInput: $('#fileInput'),
                btnExport: $('#btnExport'),
                btnImport: $('#btnImport'),
                btnBackup: $('#btnBackup'),
                btnRestore: $('#btnRestore'),
                btnSettings: $('#btnSettings'),
                btnReset: $('#btnReset'),
            };

            // ============================================================
            // SISTEMA DE TEMAS (apenas escuro, mas mantido para consistência)
            // ============================================================
            const ThemeSystem = {
                current: CONFIG.defaultTheme,

                init() {
                    const saved = state.settings?.theme || CONFIG.defaultTheme;
                    this.set(saved);
                },

                set(theme) {
                    if (!CONFIG.themes.includes(theme)) theme = CONFIG.defaultTheme;
                    this.current = theme;
                    document.documentElement.setAttribute('data-theme', theme);
                    if (state.settings) {
                        state.settings.theme = theme;
                        Storage.saveSettings();
                    }
                },

                // Sem toggle (removido o botão), mas deixamos o método para compatibilidade
                toggle() {
                    // Não faz nada, pois temos apenas um tema
                    HubAPI.showNotification('Tema único: Biblioteca Escura', 'info');
                }
            };

            // ============================================================
            // SISTEMA DE STORAGE (idêntico)
            // ============================================================
            const Storage = {
                getProject() {
                    try {
                        const raw = localStorage.getItem(CONFIG.storageKey);
                        if (raw) {
                            const data = JSON.parse(raw);
                            if (data && typeof data === 'object') return data;
                        }
                    } catch (_) {}
                    return null;
                },
                saveProject(data) {
                    try {
                        const payload = { version: CONFIG.version, lastSaved: new Date().toISOString(), data: data || {} };
                        localStorage.setItem(CONFIG.storageKey, JSON.stringify(payload));
                        return true;
                    } catch (_) { return false; }
                },
                loadProject() {
                    const raw = this.getProject();
                    return raw ? raw.data || {} : {};
                },
                getSettings() {
                    try {
                        const raw = localStorage.getItem(CONFIG.settingsKey);
                        if (raw) { const parsed = JSON.parse(raw); if (parsed && typeof parsed === 'object') return parsed; }
                    } catch (_) {}
                    return null;
                },
                saveSettings(settings) {
                    try { localStorage.setItem(CONFIG.settingsKey, JSON.stringify(settings)); return true; } catch (_) {
                        return false; }
                },
                getBackups() {
                    try {
                        const raw = localStorage.getItem(CONFIG.backupKey);
                        if (raw) { const parsed = JSON.parse(raw); if (Array.isArray(parsed)) return parsed; }
                    } catch (_) {}
                    return [];
                },
                saveBackups(backups) {
                    try {
                        const limited = backups.slice(0, CONFIG.maxBackups);
                        localStorage.setItem(CONFIG.backupKey, JSON.stringify(limited));
                        return true;
                    } catch (_) { return false; }
                },
                createBackup() {
                    const project = this.getProject();
                    if (!project) return false;
                    const backups = this.getBackups();
                    const entry = { id: Date.now(), timestamp: new Date().toISOString(), data: project };
                    backups.unshift(entry);
                    this.saveBackups(backups);
                    return entry;
                },
                restoreBackup(id) {
                    const backups = this.getBackups();
                    const entry = backups.find(b => b.id === id);
                    if (!entry) return false;
                    try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(entry.data)); return true; } catch (_) {
                        return false; }
                },
                getLatestBackup() {
                    const backups = this.getBackups();
                    return backups.length > 0 ? backups[0] : null;
                },
                resetProject() {
                    try { localStorage.removeItem(CONFIG.storageKey); return true; } catch (_) { return false; }
                },
                exportJSON() {
                    const project = this.getProject();
                    if (!project) return null;
                    return JSON.stringify(project, null, 2);
                },
                importJSON(json) {
                    try {
                        const data = JSON.parse(json);
                        if (!data || typeof data !== 'object') return false;
                        localStorage.setItem(CONFIG.storageKey, JSON.stringify(data));
                        return true;
                    } catch (_) { return false; }
                }
            };

            // ============================================================
            // SISTEMA DE NOTIFICAÇÕES
            // ============================================================
            const Notifications = {
                _container: dom.toastContainer,
                show(message, type = 'info', duration = 4000) {
                    const types = {
                        success: { icon: 'fa-check-circle', label: 'Sucesso' },
                        error: { icon: 'fa-times-circle', label: 'Erro' },
                        warning: { icon: 'fa-exclamation-triangle', label: 'Aviso' },
                        info: { icon: 'fa-info-circle', label: 'Informação' }
                    };
                    const t = types[type] || types.info;
                    const toast = document.createElement('div');
                    toast.className = `toast ${type}`;
                    toast.innerHTML = `
                        <span class="toast-icon"><i class="fas ${t.icon}"></i></span>
                        <div class="toast-content">
                            <div class="toast-title">${t.label}</div>
                            <div class="toast-message">${message}</div>
                        </div>
                        <button class="toast-close" aria-label="Fechar notificação"><i class="fas fa-times"></i></button>
                    `;
                    const close = () => {
                        toast.classList.add('removing');
                        setTimeout(() => { if (toast.parentNode) toast.remove(); }, 300);
                    };
                    toast.querySelector('.toast-close').addEventListener('click', close);
                    this._container.appendChild(toast);
                    if (duration > 0) setTimeout(close, duration);
                    return toast;
                },
                success(msg, dur) { return this.show(msg, 'success', dur); },
                error(msg, dur) { return this.show(msg, 'error', dur); },
                warning(msg, dur) { return this.show(msg, 'warning', dur); },
                info(msg, dur) { return this.show(msg, 'info', dur); }
            };

            // ============================================================
            // SISTEMA DE CONFIRMAÇÃO
            // ============================================================
            const Confirmation = {
                _resolve: null,
                _reject: null,
                show(message, title = 'Confirmar', icon = '⚠️', confirmLabel = 'Confirmar', cancelLabel = 'Cancelar',
                    isDanger = false) {
                    return new Promise((resolve, reject) => {
                        dom.confIcon.textContent = icon;
                        dom.confTitle.textContent = title;
                        dom.confMessage.textContent = message;
                        dom.confConfirm.textContent = confirmLabel;
                        dom.confCancel.textContent = cancelLabel;
                        dom.confConfirm.className = isDanger ? 'conf-btn danger' : 'conf-btn primary';
                        dom.confOverlay.classList.add('open');
                        this._resolve = resolve;
                        this._reject = reject;
                    });
                },
                _close(result) {
                    dom.confOverlay.classList.remove('open');
                    if (result === true && this._resolve) this._resolve(true);
                    else if (result === false && this._reject) this._reject(false);
                    else if (this._resolve) this._resolve(result);
                    this._resolve = null;
                    this._reject = null;
                },
                _initEvents() {
                    dom.confConfirm.addEventListener('click', () => this._close(true));
                    dom.confCancel.addEventListener('click', () => this._close(false));
                    dom.confOverlay.addEventListener('click', (e) => {
                        if (e.target === dom.confOverlay) this._close(false);
                    });
                    document.addEventListener('keydown', (e) => {
                        if (!dom.confOverlay.classList.contains('open')) return;
                        if (e.key === 'Escape') this._close(false);
                        if (e.key === 'Enter') this._close(true);
                    });
                }
            };

            // ============================================================
            // SISTEMA DE CARREGAMENTO DE PÁGINAS
            // ============================================================
            const PageLoader = {
                _currentPageId: null,
                _isLoading: false,

                async load(pageId) {
                    if (this._isLoading) return;
                    if (pageId === this._currentPageId && dom.pageContainer.dataset.page === pageId) return;

                    this._isLoading = true;
                    const container = dom.pageContainer;
                    const titleEl = dom.pageTitle;
                    const breadcrumbEl = dom.breadcrumb;

                    container.innerHTML = `
                        <div class="page-placeholder">
                            <div class="spinner"></div>
                            <h2>Carregando acervo...</h2>
                            <p>Aguardando a abertura do catálogo.</p>
                        </div>
                    `;
                    container.className = 'page-enter';
                    container.dataset.page = pageId;

                    const label = this._getPageLabel(pageId);
                    titleEl.textContent = label || pageId;
                    breadcrumbEl.innerHTML = `
                        <span class="crumb">Hub</span>
                        <span class="sep">/</span>
                        <span class="crumb">${label || pageId}</span>
                    `;

                    Sidebar.setActive(pageId);

                    if (window.location.hash !== '#' + pageId) {
                        history.pushState({ page: pageId }, '', '#' + pageId);
                    }

                    try {
                        const url = CONFIG.pagesBase + pageId + '.html';
                        const response = await fetch(url);
                        if (!response.ok) throw new Error('Página não encontrada');
                        const html = await response.text();
                        const processed = this._processPageHTML(html, pageId);
                        container.innerHTML = processed.content;
                        container.className = 'page-enter';
                        container.dataset.page = pageId;
                        this._injectStyles(processed.styles, pageId);
                        this._executeScripts(processed.scripts, pageId);
                        const pageTitle = this._extractTitle(html) || label || pageId;
                        titleEl.textContent = pageTitle;
                        breadcrumbEl.innerHTML = `
                            <span class="crumb">Hub</span>
                            <span class="sep">/</span>
                            <span class="crumb">${pageTitle}</span>
                        `;
                        this._currentPageId = pageId;
                        Notifications.info('Catálogo aberto: ' + pageTitle, 1500);
                    } catch (err) {
                        console.warn('Erro ao carregar página:', err);
                        container.innerHTML = `
                            <div class="page-placeholder">
                                <div class="icon-big"><i class="fas fa-file"></i></div>
                                <h2>Ficha em Branco</h2>
                                <p>A página <strong>${pageId}</strong> ainda não foi catalogada.<br>
                                Crie o arquivo <code>pages/${pageId}.html</code> para adicionar ao acervo.</p>
                                <div style="margin-top:12px;font-size:12px;color:var(--text-muted);">
                                    <i class="fas fa-lightbulb"></i> Dica: copie um modelo existente
                                </div>
                            </div>
                        `;
                        container.className = 'page-enter';
                        container.dataset.page = pageId;
                        titleEl.textContent = label || pageId;
                    }
                    this._isLoading = false;
                },

                _getPageLabel(id) {
                    for (const group of CONFIG.sidebarItems) {
                        for (const item of group.items) {
                            if (item.id === id) return item.label;
                        }
                    }
                    return id.charAt(0).toUpperCase() + id.slice(1);
                },

                _extractTitle(html) {
                    const match = html.match(/<title[^>]*>([^<]*)<\/title>/i);
                    return match ? match[1].trim() : null;
                },

                _processPageHTML(html, pageId) {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const bodyContent = doc.body ? doc.body.innerHTML : '';
                    const styles = [];
                    doc.querySelectorAll('style').forEach((style, i) => {
                        styles.push({ id: 'page-style-' + pageId + '-' + i, content: style.textContent });
                    });
                    const scripts = [];
                    doc.querySelectorAll('script').forEach((script, i) => {
                        if (script.src) {
                            scripts.push({ id: 'page-script-' + pageId + '-' + i, src: script.src, content: null });
                        } else {
                            scripts.push({ id: 'page-script-' + pageId + '-' + i, src: null, content: script
                                    .textContent });
                        }
                    });
                    return {
                        content: bodyContent || '<div class="page-placeholder"><p>Conteúdo vazio</p></div>',
                        styles,
                        scripts
                    };
                },

                _injectStyles(styles, pageId) {
                    document.querySelectorAll('style[id^="page-style-' + pageId + '"]').forEach(el => el.remove());
                    styles.forEach(style => {
                        const el = document.createElement('style');
                        el.id = style.id;
                        el.textContent = style.content;
                        document.head.appendChild(el);
                    });
                },

                _executeScripts(scripts, pageId) {
                    document.querySelectorAll('script[id^="page-script-' + pageId + '"]').forEach(el => el.remove());
                    scripts.forEach(script => {
                        const el = document.createElement('script');
                        el.id = script.id;
                        if (script.src) { el.src = script.src;
                            el.async = true; } else if (script.content) { el.textContent = script.content; }
                        document.body.appendChild(el);
                    });
                }
            };

            // ============================================================
            // SIDEBAR
            // ============================================================
            const Sidebar = {
                _activeId: null,

                render() {
                    const nav = dom.sidebarNav;
                    let html = '';
                    for (const group of CONFIG.sidebarItems) {
                        html += `<div class="sidebar-group">`;
                        html += `<div class="sidebar-group-title">${group.group}</div>`;
                        for (const item of group.items) {
                            const active = item.id === this._activeId ? 'active' : '';
                            html += `
                                <div class="sidebar-item ${active}" data-page="${item.id}" role="button" tabindex="0" aria-label="${item.label}" title="${item.label}">
                                    <span class="icon"><i class="fas ${item.icon}"></i></span>
                                    <span class="label">${item.label}</span>
                                </div>
                            `;
                        }
                        html += `</div>`;
                    }
                    nav.innerHTML = html;

                    nav.querySelectorAll('.sidebar-item').forEach(el => {
                        el.addEventListener('click', () => {
                            const page = el.dataset.page;
                            if (page) this.navigate(page);
                        });
                        el.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter' || e.key === ' ') {
                                e.preventDefault();
                                const page = el.dataset.page;
                                if (page) this.navigate(page);
                            }
                        });
                    });
                },

                setActive(pageId) {
                    this._activeId = pageId;
                    const items = dom.sidebarNav.querySelectorAll('.sidebar-item');
                    items.forEach(el => {
                        el.classList.toggle('active', el.dataset.page === pageId);
                    });
                },

                navigate(pageId) {
                    if (pageId === this._activeId && dom.pageContainer.dataset.page === pageId) return;
                    PageLoader.load(pageId);
                    if (state.isMobile && state.sidebarOpen) {
                        this.close();
                    }
                },

                openDesktop() {
                    dom.sidebar.classList.remove('collapsed');
                    dom.main.classList.remove('expanded');
                    state.sidebarOpen = true;
                    this._updateButtonIcon();
                },

                closeDesktop() {
                    dom.sidebar.classList.add('collapsed');
                    dom.main.classList.add('expanded');
                    state.sidebarOpen = false;
                    this._updateButtonIcon();
                },

                openMobile() {
                    dom.sidebar.classList.add('open');
                    dom.sidebarOverlay.classList.add('open');
                    state.sidebarOpen = true;
                    this._updateButtonIcon();
                },

                closeMobile() {
                    dom.sidebar.classList.remove('open');
                    dom.sidebarOverlay.classList.remove('open');
                    state.sidebarOpen = false;
                    this._updateButtonIcon();
                },

                toggle() {
                    if (state.isMobile) {
                        state.sidebarOpen ? this.closeMobile() : this.openMobile();
                    } else {
                        state.sidebarOpen ? this.closeDesktop() : this.openDesktop();
                    }
                },

                initState() {
                    if (state.isMobile) {
                        dom.sidebar.classList.remove('open');
                        dom.sidebarOverlay.classList.remove('open');
                        state.sidebarOpen = false;
                        dom.sidebar.classList.remove('collapsed');
                        dom.main.classList.remove('expanded');
                    } else {
                        dom.sidebar.classList.remove('collapsed');
                        dom.main.classList.remove('expanded');
                        state.sidebarOpen = true;
                        dom.sidebar.classList.remove('open');
                        dom.sidebarOverlay.classList.remove('open');
                    }
                    this._updateButtonIcon();
                },

                _updateButtonIcon() {
                    const icon = dom.hamburger.querySelector('i');
                    if (!icon) return;
                    if (state.isMobile) {
                        icon.className = state.sidebarOpen ? 'fas fa-times' : 'fas fa-bars';
                        dom.hamburger.title = state.sidebarOpen ? 'Fechar catálogo' : 'Abrir catálogo';
                    } else {
                        icon.className = state.sidebarOpen ? 'fas fa-chevron-left' : 'fas fa-chevron-right';
                        dom.hamburger.title = state.sidebarOpen ? 'Recolher catálogo' : 'Expandir catálogo';
                    }
                },

                init() {
                    this.render();
                    this.initState();
                    const initialPage = window.location.hash.replace('#', '') || CONFIG.defaultPage;
                    this.setActive(initialPage);
                    PageLoader.load(initialPage);
                }
            };

            // ============================================================
            // HUB API
            // ============================================================
            const HubAPI = {
                getData(key) {
                    const project = Storage.getProject();
                    if (!project) return null;
                    if (key) return project.data && project.data[key] !== undefined ? project.data[key] : null;
                    return project.data || {};
                },
                saveData(key, data) {
                    const project = Storage.getProject();
                    if (!project) {
                        const newProject = { version: CONFIG.version, lastSaved: new Date().toISOString(), data: {} };
                        newProject.data[key] = data;
                        Storage.saveProject(newProject.data);
                    } else {
                        if (!project.data) project.data = {};
                        project.data[key] = data;
                        Storage.saveProject(project.data);
                    }
                    this._triggerAutoSave();
                    return true;
                },
                getAllData() {
                    const project = Storage.getProject();
                    return project ? project.data || {} : {};
                },
                setAllData(data) {
                    Storage.saveProject(data || {});
                    this._triggerAutoSave();
                    return true;
                },
                showNotification: (msg, type, dur) => Notifications.show(msg, type, dur),
                showConfirmation: (msg, title, icon, confirmLabel, cancelLabel, isDanger) =>
                    Confirmation.show(msg, title, icon, confirmLabel, cancelLabel, isDanger),
                exportProject() {
                    const json = Storage.exportJSON();
                    if (!json) { Notifications.error('Nenhum dado para exportar.'); return; }
                    const blob = new Blob([json], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `gamehub_project_${new Date().toISOString().slice(0,10)}.json`;
                    a.click();
                    URL.revokeObjectURL(url);
                    Notifications.success('Projeto exportado com sucesso!');
                },
                importProject(file) {
                    return new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            try {
                                const json = e.target.result;
                                const success = Storage.importJSON(json);
                                if (success) {
                                    Notifications.success('Projeto importado com sucesso!');
                                    this._triggerAutoSave();
                                    resolve(true);
                                } else {
                                    Notifications.error('Erro ao importar: arquivo inválido.');
                                    reject(new Error('Arquivo inválido'));
                                }
                            } catch (err) {
                                Notifications.error('Erro ao importar: ' + err.message);
                                reject(err);
                            }
                        };
                        reader.onerror = () => { Notifications.error('Erro ao ler o arquivo.');
                            reject(new Error('Erro de leitura')); };
                        reader.readAsText(file);
                    });
                },
                createBackup() {
                    const entry = Storage.createBackup();
                    if (entry) { Notifications.success('Backup criado com sucesso!'); return entry; } else { Notifications
                            .error('Erro ao criar backup.'); return null; }
                },
                restoreBackup(id) {
                    return new Promise((resolve, reject) => {
                        this.showConfirmation(
                            'Deseja restaurar este backup? Os dados atuais serão substituídos.',
                            'Restaurar Backup', '🔄', 'Restaurar', 'Cancelar', false
                        ).then(() => {
                            const success = Storage.restoreBackup(id);
                            if (success) {
                                Notifications.success('Backup restaurado com sucesso!');
                                this._triggerAutoSave();
                                resolve(true);
                            } else {
                                Notifications.error('Erro ao restaurar backup.');
                                reject(new Error('Erro ao restaurar'));
                            }
                        }).catch(() => resolve(false));
                    });
                },
                restoreLatestBackup() {
                    const latest = Storage.getLatestBackup();
                    if (!latest) { Notifications.warning('Nenhum backup disponível.'); return Promise.resolve(false); }
                    return this.restoreBackup(latest.id);
                },
                changeTheme: (theme) => ThemeSystem.set(theme),
                getCurrentTheme: () => ThemeSystem.current,
                getSettings: () => state.settings || {},
                updateSettings(settings) {
                    state.settings = { ...state.settings, ...settings };
                    Storage.saveSettings(state.settings);
                    if (settings.theme) ThemeSystem.set(settings.theme);
                    return true;
                },
                setTitle(title) { dom.pageTitle.textContent = title || 'Game Hub'; },
                updateBreadcrumb(items) {
                    if (!items || !items.length) {
                        dom.breadcrumb.innerHTML = `<span class="crumb">Hub</span>`;
                        return;
                    }
                    let html = '';
                    items.forEach((item, idx) => {
                        if (idx > 0) html += `<span class="sep">/</span>`;
                        const isLast = idx === items.length - 1;
                        if (isLast) {
                            html += `<span class="crumb">${item}</span>`;
                        } else {
                            html += `<span class="crumb crumb-link" data-page="${item.toLowerCase()}">${item}</span>`;
                        }
                    });
                    dom.breadcrumb.innerHTML = html;
                    dom.breadcrumb.querySelectorAll('.crumb-link').forEach(el => {
                        el.addEventListener('click', () => {
                            const page = el.dataset.page;
                            if (page) Sidebar.navigate(page);
                        });
                    });
                },
                resetProject() {
                    return new Promise((resolve, reject) => {
                        this.showConfirmation(
                            'Todos os dados do projeto serão perdidos. Esta ação não pode ser desfeita.',
                            'Resetar Projeto', '⚠️', 'Resetar', 'Cancelar', true
                        ).then(() => {
                            const success = Storage.resetProject();
                            if (success) {
                                Notifications.success('Projeto resetado com sucesso!');
                                this._triggerAutoSave();
                                const current = state.currentPage || CONFIG.defaultPage;
                                PageLoader.load(current);
                                resolve(true);
                            } else {
                                Notifications.error('Erro ao resetar projeto.');
                                reject(new Error('Erro ao resetar'));
                            }
                        }).catch(() => resolve(false));
                    });
                },
                _triggerAutoSave() {
                    if (state.saveTimeout) clearTimeout(state.saveTimeout);
                    state.saveTimeout = setTimeout(() => AutoSave.save(), CONFIG.autoSaveDelay);
                },
                reloadPage() {
                    const current = state.currentPage || CONFIG.defaultPage;
                    PageLoader.load(current);
                }
            };

            // ============================================================
            // AUTO-SAVE
            // ============================================================
            const AutoSave = {
                save() {
                    if (state.isSaving) return;
                    state.isSaving = true;
                    dom.saveDot.className = 'dot saving';
                    dom.saveText.textContent = 'Salvando...';
                    try {
                        const project = Storage.getProject();
                        if (project) {
                            project.lastSaved = new Date().toISOString();
                            localStorage.setItem(CONFIG.storageKey, JSON.stringify(project));
                        }
                        dom.saveDot.className = 'dot';
                        dom.saveText.textContent = 'Salvo';
                        state.isSaving = false;
                    } catch (err) {
                        dom.saveDot.className = 'dot error';
                        dom.saveText.textContent = 'Erro';
                        state.isSaving = false;
                        console.error('Auto-save error:', err);
                    }
                },
                init() {
                    setInterval(() => { if (!state.isSaving) this.save(); }, 30000);
                    window.addEventListener('beforeunload', () => { this.save(); });
                }
            };

            // ============================================================
            // PESQUISA GLOBAL
            // ============================================================
            const GlobalSearch = {
                _input: dom.globalSearch,
                init() {
                    this._input.addEventListener('input', (e) => {
                        const query = e.target.value.trim().toLowerCase();
                        if (query.length === 0) { this._clearHighlights(); return; }
                        this._search(query);
                    });
                    this._input.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape') { this._input.value = '';
                            this._clearHighlights();
                            this._input.blur(); }
                    });
                },
                _search(query) {
                    const items = dom.sidebarNav.querySelectorAll('.sidebar-item');
                    let found = false;
                    items.forEach(el => {
                        const label = el.querySelector('.label')?.textContent?.toLowerCase() || '';
                        const match = label.includes(query);
                        el.style.display = match ? '' : 'none';
                        if (match) found = true;
                    });
                    const groups = dom.sidebarNav.querySelectorAll('.sidebar-group');
                    groups.forEach(group => {
                        const visibleItems = group.querySelectorAll('.sidebar-item[style*="display: none"]');
                        const allItems = group.querySelectorAll('.sidebar-item');
                        const hasVisible = allItems.length > visibleItems.length;
                        group.style.display = hasVisible ? '' : 'none';
                    });
                    let msg = dom.sidebarNav.querySelector('.search-empty');
                    if (!found && query.length > 0) {
                        if (!msg) {
                            msg = document.createElement('div');
                            msg.className = 'search-empty';
                            msg.style.cssText =
                                'padding:20px 12px;color:var(--text-muted);font-size:13px;text-align:center;';
                            dom.sidebarNav.appendChild(msg);
                        }
                        msg.textContent = 'Nenhum resultado para "' + query + '"';
                    } else {
                        if (msg) msg.remove();
                    }
                },
                _clearHighlights() {
                    dom.sidebarNav.querySelectorAll('.sidebar-item').forEach(el => { el.style.display = ''; });
                    dom.sidebarNav.querySelectorAll('.sidebar-group').forEach(el => { el.style.display = ''; });
                    const msg = dom.sidebarNav.querySelector('.search-empty');
                    if (msg) msg.remove();
                }
            };

            // ============================================================
            // EVENTOS DO HEADER
            // ============================================================
            function initHeaderEvents() {
                dom.hamburger.addEventListener('click', () => Sidebar.toggle());

                dom.btnExport.addEventListener('click', () => HubAPI.exportProject());

                dom.btnImport.addEventListener('click', () => dom.fileInput.click());
                dom.fileInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        HubAPI.importProject(file).then(() => HubAPI.reloadPage()).catch(() => {});
                    }
                    dom.fileInput.value = '';
                });

                dom.btnBackup.addEventListener('click', () => HubAPI.createBackup());

                dom.btnRestore.addEventListener('click', async () => {
                    const latest = Storage.getLatestBackup();
                    if (!latest) { Notifications.warning('Nenhum backup disponível.'); return; }
                    await HubAPI.restoreLatestBackup();
                    HubAPI.reloadPage();
                });

                // Botão de tema removido, mas mantemos a ação vazia para não quebrar
                // Removemos o botão do HTML, então não precisa de listener.

                dom.btnSettings.addEventListener('click', () => {
                    Notifications.info('Configurações: tema fixo — Biblioteca Escura', 3000);
                });

                dom.btnReset.addEventListener('click', async () => {
                    await HubAPI.resetProject();
                    HubAPI.reloadPage();
                });

                dom.breadcrumb.addEventListener('click', (e) => {
                    const link = e.target.closest('.crumb-link');
                    if (link) {
                        const page = link.dataset.page;
                        if (page) Sidebar.navigate(page);
                    }
                });

                dom.sidebarOverlay.addEventListener('click', () => Sidebar.closeMobile());
            }

            // ============================================================
            // RESPONSIVIDADE
            // ============================================================
            function handleResize() {
                const mobile = window.innerWidth <= 768;
                const wasMobile = state.isMobile;
                state.isMobile = mobile;

                if (mobile && !wasMobile) {
                    dom.sidebar.classList.remove('collapsed');
                    dom.main.classList.remove('expanded');
                    dom.sidebar.classList.remove('open');
                    dom.sidebarOverlay.classList.remove('open');
                    state.sidebarOpen = false;
                    Sidebar._updateButtonIcon();
                } else if (!mobile && wasMobile) {
                    dom.sidebar.classList.remove('open');
                    dom.sidebarOverlay.classList.remove('open');
                    dom.sidebar.classList.remove('collapsed');
                    dom.main.classList.remove('expanded');
                    state.sidebarOpen = true;
                    Sidebar._updateButtonIcon();
                }
            }

            // ============================================================
            // HISTÓRICO
            // ============================================================
            function initHistory() {
                window.addEventListener('popstate', (e) => {
                    const page = e.state?.page || window.location.hash.replace('#', '') || CONFIG.defaultPage;
                    if (page && page !== state.currentPage) {
                        Sidebar.setActive(page);
                        PageLoader.load(page);
                    }
                });
            }

            // ============================================================
            // INICIALIZAÇÃO
            // ============================================================
            function init() {
                const savedSettings = Storage.getSettings();
                if (savedSettings) state.settings = savedSettings;
                else { state.settings = { theme: CONFIG.defaultTheme };
                    Storage.saveSettings(state.settings); }

                ThemeSystem.init();
                Confirmation._initEvents();
                Sidebar.init();
                initHeaderEvents();
                GlobalSearch.init();
                AutoSave.init();
                initHistory();
                handleResize();
                window.addEventListener('resize', handleResize);

                state.currentPage = window.location.hash.replace('#', '') || CONFIG.defaultPage;
                window.HubAPI = HubAPI;

                setTimeout(() => {
                    Notifications.info('📚 Catálogo do Jogo aberto — Edição Biblioteca', 3000);
                }, 500);

                console.log('📚 Game Dev Hub — Biblioteca v2.0');
                console.log('📦 Versão:', CONFIG.version);
                console.log('📄 Página atual:', state.currentPage);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
