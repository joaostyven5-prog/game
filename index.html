                    const groups = dom.sidebarNav.querySelectorAll('.sidebar-group');
                    groups.forEach(group => {
                        const visibleItems = group.querySelectorAll('.sidebar-item[style*="display: none"]');
                        const allItems = group.querySelectorAll('.sidebar-item');
                        const hasVisible = allItems.length > visibleItems.length;
                        group.style.display = hasVisible ? '' : 'none';
                    });
                    let msg = dom.sidebarNav.querySelector('.search-empty');
                    if (!found && query.length > 0) {
                        if (!msg) {
                            msg = document.createElement('div');
                            msg.className = 'search-empty';
                            msg.style.cssText =
                                'padding:20px 12px;color:var(--text-muted);font-size:13px;text-align:center;';
                            dom.sidebarNav.appendChild(msg);
                        }
                        msg.textContent = 'Nenhum resultado para "' + query + '"';
                    } else {
                        if (msg) msg.remove();
                    }
                },
                _clearHighlights() {
                    dom.sidebarNav.querySelectorAll('.sidebar-item').forEach(el => { el.style.display = ''; });
                    dom.sidebarNav.querySelectorAll('.sidebar-group').forEach(el => { el.style.display = ''; });
                    const msg = dom.sidebarNav.querySelector('.search-empty');
                    if (msg) msg.remove();
                }
            };

            // ============================================================
            // EVENTOS DO HEADER
            // ============================================================
            function initHeaderEvents() {
                dom.hamburger.addEventListener('click', () => Sidebar.toggle());

                dom.btnExport.addEventListener('click', () => HubAPI.exportProject());

                dom.btnImport.addEventListener('click', () => dom.fileInput.click());
                dom.fileInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        HubAPI.importProject(file).then(() => HubAPI.reloadPage()).catch(() => {});
                    }
                    dom.fileInput.value = '';
                });

                dom.btnBackup.addEventListener('click', () => HubAPI.createBackup());

                dom.btnRestore.addEventListener('click', async () => {
                    const latest = Storage.getLatestBackup();
                    if (!latest) { Notifications.warning('Nenhum backup disponível.'); return; }
                    await HubAPI.restoreLatestBackup();
                    HubAPI.reloadPage();
                });

                dom.btnTheme.addEventListener('click', () => ThemeSystem.toggle());

                dom.btnSettings.addEventListener('click', () => {
                    Notifications.info('Configurações: tema atual = ' + ThemeSystem.current, 3000);
                });

                dom.btnReset.addEventListener('click', async () => {
                    await HubAPI.resetProject();
                    HubAPI.reloadPage();
                });

                dom.breadcrumb.addEventListener('click', (e) => {
                    const link = e.target.closest('.crumb-link');
                    if (link) {
                        const page = link.dataset.page;
                        if (page) Sidebar.navigate(page);
                    }
                });

                dom.sidebarOverlay.addEventListener('click', () => Sidebar.close());
            }

            // ============================================================
            // RESPONSIVIDADE
            // ============================================================
            function handleResize() {
                const mobile = window.innerWidth <= 768;
                state.isMobile = mobile;
                if (!mobile) {
                    Sidebar.close();
                    dom.sidebar.classList.remove('closed');
                    dom.main.classList.remove('expanded');
                } else {
                    dom.sidebar.classList.remove('closed');
                }
            }

            // ============================================================
            // HISTÓRICO
            // ============================================================
            function initHistory() {
                window.addEventListener('popstate', (e) => {
                    const page = e.state?.page || window.location.hash.replace('#', '') || CONFIG.defaultPage;
                    if (page && page !== state.currentPage) {
                        Sidebar.setActive(page);
                        PageLoader.load(page);
                    }
                });
            }

            // ============================================================
            // INICIALIZAÇÃO
            // ============================================================
            function init() {
                const savedSettings = Storage.getSettings();
                if (savedSettings) state.settings = savedSettings;
                else { state.settings = { theme: CONFIG.defaultTheme };
                    Storage.saveSettings(state.settings); }

                ThemeSystem.init();
                Confirmation._initEvents();
                Sidebar.init();
                initHeaderEvents();
                GlobalSearch.init();
                AutoSave.init();
                initHistory();
                handleResize();
                window.addEventListener('resize', handleResize);

                state.currentPage = window.location.hash.replace('#', '') || CONFIG.defaultPage;
                window.HubAPI = HubAPI;

                setTimeout(() => {
                    Notifications.info('Bem-vindo ao Game Dev Hub v2.0 🚀', 3000);
                }, 500);

                console.log('🏗️ Game Dev Hub v2.0 inicializado');
                console.log('📦 Versão:', CONFIG.version);
                console.log('🎨 Tema:', ThemeSystem.current);
                console.log('📄 Página atual:', state.currentPage);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
